name: refresh-data

# Fetches new raw snapshots on GitHub's runners (which have network access to the
# statistics APIs), rebuilds the pipeline, runs tests and monitoring, and proposes the
# result as a pull request. It never merges anything itself.
#
# Notes:
# - "Allow GitHub Actions to create and approve pull requests" must be enabled in the
#   repository settings for the PR step to work.
# - PRs opened with GITHUB_TOKEN do not trigger ci.yml, so this workflow runs ruff and
#   pytest itself and writes the results into the PR description.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 20 * *"  # 20th of each month; Tillväxtanalys publishes around the 12th
  push:
    branches: ["claude/**"]
    paths:
      - "src/fetch/**"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Fetch and build
        id: pipeline
        env:
          RIKSBANK_API_KEY: ${{ secrets.RIKSBANK_API_KEY }}
        run: |
          set +e
          python -m src.pipeline --refresh > data/raw/_fetch_log.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 data/raw/_fetch_log.txt

      - name: Lint and test
        id: checks
        run: |
          set +e
          { ruff check . && ruff format --check .; } > /tmp/ruff.txt 2>&1
          echo "ruff=$?" >> "$GITHUB_OUTPUT"
          python -m pytest > /tmp/pytest.txt 2>&1
          echo "pytest=$?" >> "$GITHUB_OUTPUT"
          cp /tmp/pytest.txt data/raw/_pytest_log.txt
          tail -n 20 /tmp/pytest.txt

      - name: Commit snapshot to a new branch
        id: commit
        run: |
          branch="data-refresh/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data reports
          git commit -m "Refresh data snapshot $(date -u +%Y-%m-%d)" || { echo "Nothing to commit"; exit 0; }
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request (scheduled or manual runs)
        if: steps.commit.outputs.branch != '' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## What"
            echo "Monthly data refresh: new raw snapshots, rebuilt panels, tables and monitoring log."
            echo
            echo "## Checks run inside this workflow"
            echo "PRs opened with GITHUB_TOKEN do not trigger ci.yml, so the checks are run here."
            echo
            echo "- pipeline exit code: ${{ steps.pipeline.outputs.exit }}"
            echo "- ruff exit code: ${{ steps.checks.outputs.ruff }}"
            echo "- pytest exit code: ${{ steps.checks.outputs.pytest }}"
            echo
            echo '```'
            tail -n 30 /tmp/pytest.txt
            echo '```'
            echo
            echo "Review the monitoring log (reports/tables/monitoring_log.csv) before merging."
          } > /tmp/body.md
          gh pr create --base main --head "${{ steps.commit.outputs.branch }}" \
            --title "Data refresh $(date -u +%Y-%m-%d)" --body-file /tmp/body.md
