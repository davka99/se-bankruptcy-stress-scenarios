name: pages

# Builds the Quarto report from the committed processed data and figures and deploys it to
# GitHub Pages. Pages on a free account requires a public repository, so the workflow
# only runs when the repository is public.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render report
        run: |
          cp -r reports/figures reports/site/figures
          quarto render reports/site/index.qmd
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
